name: release

# Triggered on pushed tags `vX.Y.Z`. Builds a multi-arch image
# (linux/amd64 + linux/arm64) and pushes to GHCR with the full set of
# tags (`:vX.Y.Z`, `:vX.Y`, `:vX`, `:latest`).
#
# Authentication uses GITHUB_TOKEN with `packages: write` — no extra
# secrets needed, GHCR understands `GITHUB_TOKEN` for the owning repo.
# To also push to Docker Hub, add a docker/login-action step + DOCKERHUB
# secrets. We start with GHCR-only.
#
# Idempotent — if you re-run on an existing tag, the same digest is
# pushed (no-op). Use workflow_dispatch with a tag input for manual
# rebuilds.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # Write scopes live on the job, not top-level, so the token every other
    # (future) job gets stays read-only — OpenSSF Scorecard's
    # Token-Permissions check zeroes on any top-level write.
    permissions:
      contents: write
      packages: write
      id-token: write # keyless Sigstore signing (attest-build-provenance)
      attestations: write # persist the attestation in GitHub's store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          # Check out the tag for manual reruns; defaults to the
          # pushed tag in the auto-trigger case.
          ref: ${{ inputs.tag || github.ref }}

      - name: Compute version components
        id: ver
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="${REF#v}"
          major="${ver%%.*}"
          minorpatch="${ver#*.}"
          minor="${minorpatch%%.*}"
          {
            echo "ver=$ver"
            echo "major=$major"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/browser-bridge:v${{ steps.ver.outputs.ver }}
            ghcr.io/${{ github.repository_owner }}/browser-bridge:v${{ steps.ver.outputs.major }}.${{ steps.ver.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/browser-bridge:v${{ steps.ver.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/browser-bridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const md = fs.existsSync('CHANGELOG.md') ? fs.readFileSync('CHANGELOG.md', 'utf-8') : '';
            const re = new RegExp('^## \\\\[' + process.env.VERSION + '\\\\][^\\\\n]*\\\\n([\\\\s\\\\S]*?)(?=\\\\n## \\\\[|$)', 'm');
            const m = re.exec(md);
            const body = m ? m[1].trim() : '';
            fs.writeFileSync('release-notes.md', body || ('Release v' + process.env.VERSION));
          "

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

      - name: Attest image provenance (keyless Sigstore)
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/browser-bridge
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attach provenance bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.ver.outputs.ver }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "browser-bridge-${TAG}-image.sigstore.json"
          gh release upload "$TAG" --clobber "browser-bridge-${TAG}-image.sigstore.json"
