name: release

# Triggered on pushed tags `vX.Y.Z`. Builds a multi-arch image
# (linux/amd64 + linux/arm64) and pushes to GHCR with the full set of
# tags (`:vX.Y.Z`, `:vX.Y`, `:vX`, `:latest`).
#
# Authentication uses GITHUB_TOKEN with `packages: write` — no extra
# secrets needed, GHCR understands `GITHUB_TOKEN` for the owning repo.
# To also push to Docker Hub, add a docker/login-action step + DOCKERHUB
# secrets. We start with GHCR-only.
#
# Idempotent — if you re-run on an existing tag, the same digest is
# pushed (no-op). Use workflow_dispatch with a tag input for manual
# rebuilds.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # Write scopes live on the job, not top-level, so the token every other
    # (future) job gets stays read-only — OpenSSF Scorecard's
    # Token-Permissions check zeroes on any top-level write.
    permissions:
      contents: write
      packages: write
      id-token: write # keyless Sigstore signing (attest-build-provenance)
      attestations: write # persist the attestation in GitHub's store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Check out the tag for manual reruns; defaults to the
          # pushed tag in the auto-trigger case.
          ref: ${{ inputs.tag || github.ref }}

      - name: Compute version components
        id: ver
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ver="${REF#v}"
          major="${ver%%.*}"
          minorpatch="${ver#*.}"
          minor="${minorpatch%%.*}"
          {
            echo "ver=$ver"
            echo "major=$major"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/browser-bridge:v${{ steps.ver.outputs.ver }}
            ghcr.io/${{ github.repository_owner }}/browser-bridge:v${{ steps.ver.outputs.major }}.${{ steps.ver.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/browser-bridge:v${{ steps.ver.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/browser-bridge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Extract release notes from CHANGELOG
        # scripts/release-notes.mjs is line-based and covered by test/release-notes.test.mjs
        # (part of `npm test`), so the body a tag ships is asserted on every PR.
        env:
          VERSION: ${{ steps.ver.outputs.ver }}
        run: node scripts/release-notes.mjs "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.ver.outputs.ver }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi

      - name: Attest image provenance (keyless Sigstore)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/browser-bridge
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attach provenance bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.ver.outputs.ver }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "browser-bridge-${TAG}-image.sigstore.json"
          gh release upload "$TAG" --clobber "browser-bridge-${TAG}-image.sigstore.json"
