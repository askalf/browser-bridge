name: actionlint

# Lint workflow YAML on every PR + push so syntax errors / shellcheck
# violations / pinned-action-tag violations get caught before merge.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  actionlint:
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on browser-bridge-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    # A fork repository has no browser-bridge-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/browser-bridge' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","browser-bridge-exec"]') }}
    timeout-minutes: 5
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@a0e4d158cef53c461deb53322c4f3826c1e93bad # main 2026-10-24, askalf/ci#123
        with:
          persist-credentials: false
      - name: actionlint
        # Checksum-pinned release tarball instead of piping the (mutable,
        # main-branch) installer script into bash — Scorecard flags that as
        # unpinned download-then-run, and it's the real supply-chain seam here.
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color
