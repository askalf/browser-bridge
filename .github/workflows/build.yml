name: build

# Verifies the Dockerfile builds cleanly on every PR / push. Doesn't
# push the image — that's release.yml on a tag. We just want to catch
# Dockerfile breaks (apt-get failing, npm install diverging, etc.)
# before they hit a release.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Unit tests (cdp-proxy)
        # Zero-dep tests against a stub upstream — runner's system Node
        # is plenty; no npm install needed.
        run: node --test test/cdp-proxy.test.mjs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build (no push) — verifies Dockerfile is sound
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: browser-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
