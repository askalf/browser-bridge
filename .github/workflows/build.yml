name: build

# Verifies the Dockerfile builds cleanly on every PR / push. Doesn't
# push the image — that's release.yml on a tag. We just want to catch
# Dockerfile breaks (apt-get failing, npm install diverging, etc.)
# before they hit a release.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on browser-bridge-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    runs-on: ${{ github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","browser-bridge-exec"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Test on the runtime the image ships (node:26-slim), not whatever the
      # runner image happens to carry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Install deps
        # The MCP-server tests import @modelcontextprotocol/sdk; puppeteer-core
        # pulls no browser, so this stays fast.
        run: npm ci
      - name: Unit tests (cdp-proxy + session-broker + mcp-server)
        run: npm test

  # docker-build needs a Docker daemon, and browser-bridge-exec has none (Docker on our host is root). So the
  # image job runs on GitHub's runners, on every push to the default branch and on a PR that
  # changes what the image is built from: the Dockerfile, .dockerignore, the package files, the
  # root .mjs files it copies, or this file. The required check docker-build runs on our runner and passes only when that
  # job passed or was not owed, so a PR that changes none of them never waits on GitHub's queue.
  docker-build-inputs:
    runs-on: ${{ github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","browser-bridge-exec"]') }}
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: diff
        name: does the image depend on a changed file
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          files=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$files"
          if printf '%s\n' "$files" | grep -qE '^(Dockerfile|\.dockerignore|package(-lock)?\.json|[^/]+\.mjs|\.github/workflows/build\.yml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build-image:
    needs: docker-build-inputs
    if: needs.docker-build-inputs.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build + load — verifies Dockerfile is sound and gives us an image to run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: browser-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot smoke — the container must actually START, not just build
        # docker-build only ever *built* the image, so a runtime-only break —
        # a module imported by launch.mjs but never COPY'd in (session-broker.mjs
        # slipped through exactly this way) — passed CI and would only crash on a
        # real `docker run`. Boot the image and wait for the post-launch marker.
        run: |
          set -eo pipefail
          docker run -d --name bb --shm-size=512m browser-bridge:ci
          ok=0
          logs=""
          for _ in $(seq 1 24); do
            if [ -z "$(docker ps -q -f name=bb -f status=running)" ]; then
              echo "::error::container exited during startup"; docker logs bb; exit 1
            fi
            # Snapshot the logs and grep the variable. A live `docker logs | grep -q`
            # pipe under pipefail is a race: grep -q exits on first match, docker logs
            # takes SIGPIPE if it's still writing, and the pipeline fails despite the
            # match (#49 — failed a healthy boot as "ua.mjs did not run").
            logs="$(docker logs bb 2>&1)"
            if grep -q "stealth Chromium running" <<<"$logs"; then ok=1; break; fi
            sleep 5
          done
          echo "--- container logs ---"; head -40 <<<"$logs"
          [ "$ok" = "1" ] || { echo "::error::bridge never reached 'stealth Chromium running'"; exit 1; }
          # Prove ua.mjs ran and derived the major from the REAL Chromium. Same
          # snapshot as the marker check — the major line is logged before the
          # marker, so a snapshot containing the marker must contain it.
          grep -Eq "Chromium major: [0-9]+" <<<"$logs" \
            || { echo "::error::no 'Chromium major:' line — ua.mjs did not run"; exit 1; }
          echo "boot smoke OK"
      - name: Teardown
        if: always()
        run: docker rm -f bb || true

  docker-build:
    needs: [docker-build-inputs, docker-build-image]
    if: always()
    runs-on: ${{ github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || fromJSON('["self-hosted","browser-bridge-exec"]') }}
    timeout-minutes: 5
    steps:
      - name: the image job passed, or no change owed one
        env:
          INPUTS: ${{ needs.docker-build-inputs.result }}
          CHANGED: ${{ needs.docker-build-inputs.outputs.changed }}
          IMAGE: ${{ needs.docker-build-image.result }}
        run: |
          echo "docker-build-inputs: $INPUTS (changed=$CHANGED), docker-build-image: $IMAGE"
          test "$INPUTS" = success
          if [ "$CHANGED" = true ]; then test "$IMAGE" = success; fi
