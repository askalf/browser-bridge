name: build

# Verifies the Dockerfile builds cleanly on every PR / push. Doesn't
# push the image — that's release.yml on a tag. We just want to catch
# Dockerfile breaks (apt-get failing, npm install diverging, etc.)
# before they hit a release.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build (no push) — verifies Dockerfile is sound
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: false
          tags: browser-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
