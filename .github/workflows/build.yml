name: build

# Verifies the Dockerfile builds cleanly on every PR / push. Doesn't
# push the image — that's release.yml on a tag. We just want to catch
# Dockerfile breaks (apt-get failing, npm install diverging, etc.)
# before they hit a release.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    # Fails a PR that adds an em dash or carries a model identity or
    # attribution trailer in its commits, before a reviewer has to say so.
    # See scripts/check-hygiene.mjs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Added text and commit identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-hygiene.mjs --range "$BASE_SHA..$HEAD_SHA"

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install deps
        # The MCP-server tests import @modelcontextprotocol/sdk; puppeteer-core
        # pulls no browser, so this stays fast.
        run: npm ci
      - name: Unit tests (cdp-proxy + session-broker + mcp-server)
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build + load — verifies Dockerfile is sound and gives us an image to run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: browser-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot smoke — the container must actually START, not just build
        # docker-build only ever *built* the image, so a runtime-only break —
        # a module imported by launch.mjs but never COPY'd in (session-broker.mjs
        # slipped through exactly this way) — passed CI and would only crash on a
        # real `docker run`. Boot the image and wait for the post-launch marker.
        run: |
          set -eo pipefail
          docker run -d --name bb --shm-size=512m browser-bridge:ci
          ok=0
          logs=""
          for _ in $(seq 1 24); do
            if [ -z "$(docker ps -q -f name=bb -f status=running)" ]; then
              echo "::error::container exited during startup"; docker logs bb; exit 1
            fi
            # Snapshot the logs and grep the variable. A live `docker logs | grep -q`
            # pipe under pipefail is a race: grep -q exits on first match, docker logs
            # takes SIGPIPE if it's still writing, and the pipeline fails despite the
            # match (#49 — failed a healthy boot as "ua.mjs did not run").
            logs="$(docker logs bb 2>&1)"
            if grep -q "stealth Chromium running" <<<"$logs"; then ok=1; break; fi
            sleep 5
          done
          echo "--- container logs ---"; head -40 <<<"$logs"
          [ "$ok" = "1" ] || { echo "::error::bridge never reached 'stealth Chromium running'"; exit 1; }
          # Prove ua.mjs ran and derived the major from the REAL Chromium. Same
          # snapshot as the marker check — the major line is logged before the
          # marker, so a snapshot containing the marker must contain it.
          grep -Eq "Chromium major: [0-9]+" <<<"$logs" \
            || { echo "::error::no 'Chromium major:' line — ua.mjs did not run"; exit 1; }
          echo "boot smoke OK"
      - name: Teardown
        if: always()
        run: docker rm -f bb || true
