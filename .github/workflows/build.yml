name: build

# Verifies the Dockerfile builds cleanly on every PR / push. Doesn't
# push the image — that's release.yml on a tag. We just want to catch
# Dockerfile breaks (apt-get failing, npm install diverging, etc.)
# before they hit a release.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build (no push) — verifies Dockerfile is sound
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          tags: browser-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
