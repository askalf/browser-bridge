# Manual: posts the fleet review-lane statuses on every open same-repo PR. Run it right after
# the fleet/* contexts become required checks, so PRs opened before that report.
name: Fleet status backfill

on:
  workflow_dispatch:

permissions: {}

jobs:
  backfill:
    # Our own script on its own trigger, never PR code: on our runner, so GitHub's hosted
    # queue going down does not stop it. A fork repository has no browser-bridge-exec runners,
    # so there it runs on GitHub's.
    runs-on: ${{ github.repository == 'askalf/browser-bridge' && fromJSON('["self-hosted","browser-bridge-exec"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: write
    steps:
      - uses: askalf/ci/actions/fleet-status@9718a75899ff8774d5f6b8135ffb067fabe9dc24 # main 2026-10-29, askalf/ci#139
        with:
          all-open: 'true'
