name: hygiene

# Fails a PR that adds an em dash, or carries a model identity or
# attribution in its commits or description. Its own workflow so that
# editing the description re-runs this check and not the image build.
# See scripts/check-hygiene.mjs.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    # Our own code (pushes, same-repo PRs, schedules, dispatches) runs on browser-bridge-exec, the
    # non-root one-job runners on our host, so GitHub's hosted
    # queue going down does not hold our PRs. A fork's PR and a Dependabot PR run code nobody
    # here wrote, so they stay on GitHub's runners.
    # A fork repository has no browser-bridge-exec runners, so every run there stays on GitHub's runners too.
    runs-on: ${{ (github.repository != 'askalf/browser-bridge' || github.event.pull_request && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')) && 'ubuntu-latest' || fromJSON('["self-hosted","browser-bridge-exec"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Added text and commit identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-hygiene.mjs --range "$BASE_SHA..$HEAD_SHA"
      # Dependabot's description quotes upstream release notes, which are not
      # ours to edit; its added text and commits are still checked above.
      - name: PR description
        if: always() && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-hygiene.mjs --pr-body
