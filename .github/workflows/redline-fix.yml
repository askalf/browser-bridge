# Redline fix: when Redline requests changes on a pull request here, the ops tick dispatches this run
# with the PR, the head Redline reviewed and the review. The fix itself is computed by
# askalf/ci (redline-fix-run.yml) on this repository's fix-lane runner and uploaded as
# the redline-fix artifact. Nothing here pushes or comments, and no token that could is on the
# runner: the ops tick verifies the artifact and pushes the fix to the PR branch with its own token.
name: Redline fix
run-name: Redline fix ${{ github.repository }}#${{ inputs.pr }} @ ${{ inputs.head }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number.
        required: true
        type: string
      head:
        description: The full commit sha Redline reviewed. The run fails if the PR has moved past it.
        required: true
        type: string
      review:
        description: URL of the REQUEST_CHANGES review being answered.
        required: true
        type: string
      dry_run:
        description: Compute the fix and upload its diff; no commit, no bundle.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

# Keyed to the review being answered, not just the PR: a GitHub concurrency group keeps at most
# one running and one pending run, so grouping on the PR alone would let a third review for the
# same PR cancel the pending run for a second. Runs answering different reviews land in
# different groups, so they are not serialized against each other and can overlap.
concurrency:
  group: fix-${{ github.repository }}-${{ inputs.pr }}-${{ inputs.review }}
  cancel-in-progress: false

jobs:
  fix:
    # Pinned so a change to the fix workflow reaches this repo only through a reviewed bump here.
    uses: askalf/ci/.github/workflows/redline-fix-run.yml@ee929e043efd3a7854257566a3c77af0cc4a0b7f # main 2026-11-06, askalf/ci#183
    with:
      redline-ref: ee929e043efd3a7854257566a3c77af0cc4a0b7f
      # browser-bridge-fix is this repository's fix-lane runner: its own non-root account, one job
      # per registration. Only this workflow targets that label.
      runner-label: browser-bridge-fix
      pr: ${{ inputs.pr }}
      head: ${{ inputs.head }}
      review: ${{ inputs.review }}
      dry_run: ${{ inputs.dry_run }}
