# Path → label map for .github/workflows/pr-triage.yml (actions/labeler v7).
#
# Additive only: sync-labels is off, so nothing here ever strips a label a
# human — or Dependabot — put on a PR by hand. Add a path, get a label.
#
# Bare-noun labels, matching the Own Your Stack family vocabulary (redstamp is
# the reference), so a reader moving between repos sees the same words.

browser:
  - changed-files:
      - any-glob-to-any-file:
          - 'launch.mjs'
          - 'launch-opts.mjs'
          - 'ua.mjs'
          - 'stealth-score.mjs'
          - 'profile-lock.mjs'

proxy:
  - changed-files:
      - any-glob-to-any-file:
          - 'cdp-proxy.mjs'
          - 'proxy-auth-relay.mjs'
          - 'session-broker.mjs'

mcp:
  - changed-files:
      - any-glob-to-any-file:
          - 'mcp-server.mjs'

policy:
  - changed-files:
      - any-glob-to-any-file:
          - 'policy/**'

docker:
  - changed-files:
      - any-glob-to-any-file:
          - 'Dockerfile'
          - '.dockerignore'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'
          - '**/*.test.mjs'

fuzz:
  - changed-files:
      - any-glob-to-any-file:
          - 'fuzz/**'
          - '.clusterfuzzlite/**'

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/labeler.yml'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'CHANGELOG.md'
          - 'CONTRIBUTING.md'
          - 'CODE_OF_CONDUCT.md'
          - 'SECURITY.md'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/pull_request_template.md'

